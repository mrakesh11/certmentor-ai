<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertMentor.AI — AWS CLF-C02 Study Workspace</title>
    <meta name="description" content="Study the AWS Cloud Practitioner (CLF-C02) curriculum and practice fact-checked questions." />
    <meta name="theme-color" content="#fcfcfd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Resolve the theme before first paint so there is no flash of the
         wrong scheme. Mirrors src/lib/theme.js: an explicit stored choice
         wins, otherwise "system" follows prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aws_clf_theme_v1');
          var pref = (stored === 'light' || stored === 'dark') ? stored : 'system';
          var dark = pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#1f1f1f' : '#fcfcfd');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
